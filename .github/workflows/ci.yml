name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02. Web/recetas-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 02. Web/recetas-web/package-lock.json

      - run: npm ci

      # Bloqueante: es exactamente el chequeo que habría detectado el fallo
      # de build de TS1117 (claves duplicadas) antes de llegar a producción.
      # Necesita credenciales reales de Supabase porque
      # generateStaticParams (src/app/recetas/[id]/page.tsx) consulta el
      # catálogo en build time para pre-renderizar cada receta.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Informativo, no bloqueante: hay avisos/errores de lint preexistentes
      # (scripts/*.js con require(), un par de reglas nuevas de React
      # Compiler) que no impiden el build y no son parte de este cambio.
      - run: npm run lint
        continue-on-error: true
